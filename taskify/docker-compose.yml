version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: taskify-mysql
    restart: always
    environment:
      MYSQL_DATABASE: taskify_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: taskify:0.0.1-SNAPSHOT
    container_name: taskify-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/taskify_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    depends_on:
      - db

volumes:
  mysql_data:
